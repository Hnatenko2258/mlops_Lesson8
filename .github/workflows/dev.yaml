name: Dev CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  PULUMI_STATE: s3://pulumi-state-ach7mohb

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - uses: pulumi/actions@v6

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.30"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install the project

        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.pythonLocation }}
        run: |
          uv sync --only-dev

      - name: Download the model
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          dvc pull models/model.pth.dvc

      - name: Deploy the Pulumi stack
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PULUMI_CONFIG_PASSPHRASE: "ci"
          PULUMI_STACK: cats-dogs.dev
        run: |
          pulumi login $PULUMI_STATE
          pulumi stack select $PULUMI_STACK || pulumi stack init $PULUMI_STACK

          pulumi config set docker_platform linux/amd64
          pulumi config set cpu_architecture X86_64

          pulumi up --yes --refresh
